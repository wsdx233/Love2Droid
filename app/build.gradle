import java.nio.charset.StandardCharsets
import groovy.json.JsonSlurper
import java.security.MessageDigest


plugins {
    id 'com.android.application'
}
def offlineAssetsDir = providers.gradleProperty('offlineRootfsDir').map { file(it) }
        .orElse(rootProject.layout.buildDirectory.dir('offline-rootfs/assets').map { it.asFile })

android {
    namespace "top.wsdx233.love2droid"
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId project.properties["app.application_id"]
        versionCode project.properties["app.version_code"].toInteger()
        versionName project.properties["app.version_name"]
        minSdk 23
        compileSdk = 37
        // PRoot executes its bundled guest loader from app-private storage; Android's
        // targetSdk 29+ W^X policy rejects that exec even when chmod succeeds.
        targetSdk = 28
        buildConfigField 'boolean', 'BUNDLED_ROOTFS', 'false'

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=1", "-DCMAKE_POLICY_VERSION_MINIMUM=3.5", "-DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON", "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                // https://issuetracker.google.com/issues/274493986
                // Transitive shared library that's added through `add_dependencies` is not taken into
                // account. This result in liboboe.so and libluajit.so not get included into the final
                // APK. "love" target depends on LuaJIT, and "OpenAL" target depends on oboe::oboe
                // (which provides liboboe.so). So, add "OpenAL" and "love" target.
                targets "love_android", "OpenAL", "love"
            }
        }

        ndk {
            debugSymbolLevel 'full'
        }

        def getAppName = {
            def nameArray = project.properties["app.name_byte_array"]
            def name = project.properties["app.name"]
            if (name != null && nameArray != null) {
                throw new Exception("Only define either `app.name` or `app.name_byte_array` in gradle.properties, but not both!")
            }

            if (name == null) {
                def nameArraySplit = nameArray.split(",")
                def nameBytes = new byte[nameArraySplit.length]
                def count = 0
                for (String s: nameArraySplit) {
                    nameBytes[count++] = (byte) Integer.parseInt(s)
                }
                return new String(nameBytes, StandardCharsets.UTF_8)
            }
            return name
        }

        manifestPlaceholders = [
            NAME:getAppName(),
            ORIENTATION:project.properties["app.orientation"],
        ]
    }

    def retrieveAll3pModules = { ->
        def modules = []

        fileTree("src/main/cpp/lua-modules/").visit { FileVisitDetails details ->
            if (details.isDirectory()) {
                if (file(details.file.path + "/Android.mk").exists() ||
                        file(details.file.path + "/CMakeLists.mk").exists()) {
                    def logger = project.getLogger()
                    logger.lifecycle("3rd-party module: " + details.file.path)

                    def javainfo = file(details.file.path + "/java.txt")
                    if (javainfo.exists()) {
                        def fstream = new FileInputStream(javainfo)
                        def infile = new BufferedReader(new InputStreamReader(fstream))
                        def javapath = infile.readLine().replace("\\", "/")
                        def mpath = null

                        if (javapath[0] != '/') {
                            mpath = details.file.path + "/" + javapath
                        } else {
                            mpath = details.file.path + javapath
                        }

                        modules << mpath

                        logger.lifecycle("Registered path " + mpath)
                        infile.close()
                    }
                }
            }
        }

        return modules
    }

    def releasePropertiesFile = rootProject.file('keystore.properties')
    if (releasePropertiesFile.isFile()) {
        def releaseProperties = new Properties()
        releasePropertiesFile.withInputStream { releaseProperties.load(it) }
        ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
            if (!releaseProperties.getProperty(key)) throw new GradleException("Missing signing property: $key")
        }
        signingConfigs {
            release {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releasePropertiesFile.isFile()) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        prefab true
        buildConfig true
    }

    flavorDimensions = ['mode', 'recording']
    productFlavors {
        normal {
            dimension 'mode'
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        }
        embed {
            dimension 'mode'
            ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        }
        offline {
            dimension 'mode'
            buildConfigField 'boolean', 'BUNDLED_ROOTFS', 'true'
            ndk { abiFilters 'arm64-v8a' }
        }
        record {
            dimension 'recording'
        }
        noRecord {
            dimension 'recording'
        }
    }

    sourceSets {
        main {
            java {
                srcDir 'src/main/cpp/megasource/libs/SDL3/android-project/app/src/main/java'
                srcDir 'src/main/java'
                srcDir 'src/main/cpp/love/src/libraries/luahttps/src/android/java'
                srcDirs += retrieveAll3pModules()
            }
        }
        normal {
            java {
                srcDir 'src/normal/java'
            }
            assets.srcDir "$buildDir/generated/game-template/assets"
        }
        offline {
            manifest.srcFile 'src/normal/AndroidManifest.xml'
            java.srcDir 'src/normal/java'
            kotlin.directories.add('src/normal/java')
            res.srcDir 'src/normal/res'
            jniLibs.srcDir 'src/normal/jniLibs'
            assets.srcDirs 'src/normal/assets', "$buildDir/generated/game-template/assets", offlineAssetsDir.get()
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        viewBinding true
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            // '+' notation apparently has been supported long time ago
            // https://issuetracker.google.com/issues/110693527#comment22
            // We require CMake 3.21 because r23 has important fixes
            // that's only fixed if CMake 3.21 is used.
            // https://github.com/android/ndk/issues/463
            version '3.21.0+'
        }
    }
    androidResources {
        noCompress += ['xz']
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
            excludes += [
                'lib/armeabi-v7a/libOpenSLES.so',
                'lib/arm64-v8a/libOpenSLES.so',
                'lib/x86/libOpenSLES.so',
                'lib/x86_64/libOpenSLES.so'
            ]
        }
    }
}

def verifyOfflineRootfs = tasks.register('verifyOfflineRootfs') {
    def manifestFile = offlineAssetsDir.map { new File(it, 'proot/offline/manifest.json') }
    def archiveFile = offlineAssetsDir.map { new File(it, 'proot/offline/rootfs-arm64.tar.xz') }
    inputs.file(manifestFile)
    inputs.file(archiveFile)
    doLast {
        def metadata = new JsonSlurper().parse(manifestFile.get())
        def archive = archiveFile.get()
        if (metadata.formatVersion != 1 || metadata.abi != 'arm64-v8a' ||
                metadata.archive != archive.name || metadata.compressedBytes != archive.length() ||
                metadata.components.toSet() != ['rootfs', 'lua_lsp', 'omp', 'dsh', 'git', 'love_check'].toSet() ||
                metadata.decoderMemoryLimitKiB > 65536) {
            throw new GradleException('Invalid full offline image; run python3 tools/offline-rootfs.py build')
        }
        def digest = MessageDigest.getInstance('SHA-256')
        archive.withInputStream { stream ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = stream.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        if (digest.digest().encodeHex().toString() != metadata.sha256) {
            throw new GradleException('Offline image SHA-256 mismatch')
        }
    }
}

def gameTemplateWorkDir = layout.buildDirectory.dir('intermediates/game-template')
def gameTemplateAsset = layout.buildDirectory.file('generated/game-template/assets/game-template.apk')
def compileGameTemplateResources = tasks.register('compileGameTemplateResources', Exec) {
    def sourceIcon = file('src/main/res/drawable-xxxhdpi/love.png')
    def stagedResources = gameTemplateWorkDir.map { it.dir('res') }
    def compiledResources = gameTemplateWorkDir.map { it.file('compiled-resources.zip') }
    inputs.file(sourceIcon)
    outputs.file(compiledResources)
    doFirst {
        delete(stagedResources.get().asFile)
        copy {
            from sourceIcon
            into new File(stagedResources.get().asFile, 'drawable')
            rename { 'icon.png' }
        }
        compiledResources.get().asFile.parentFile.mkdirs()
        commandLine(
            androidComponents.sdkComponents.aapt2.get().executable.get().asFile,
            'compile', '--dir', stagedResources.get().asFile,
            '-o', compiledResources.get().asFile,
        )
    }
}

def linkGameTemplate = tasks.register('linkGameTemplate', Exec) {
    dependsOn compileGameTemplateResources
    def manifestFile = file('src/gameTemplate/AndroidManifest.xml')
    def compiledResources = gameTemplateWorkDir.map { it.file('compiled-resources.zip') }
    def androidJar = androidComponents.sdkComponents.bootClasspath.map { files -> files.first() }
    inputs.file(manifestFile)
    inputs.file(compiledResources)
    inputs.file(androidJar)
    outputs.file(gameTemplateAsset)
    doFirst {
        gameTemplateAsset.get().asFile.parentFile.mkdirs()
        commandLine(
            androidComponents.sdkComponents.aapt2.get().executable.get().asFile,
            'link', '-o', gameTemplateAsset.get().asFile,
            '-I', androidJar.get().asFile,
            '--manifest', manifestFile,
            '-R', compiledResources.get().asFile,
        )
    }
}

tasks.configureEach { task ->
    if ((task.name.contains('Normal') || task.name.contains('Offline')) &&
            ((task.name.startsWith('merge') && task.name.endsWith('Assets')) ||
                    task.name.contains('Lint') || task.name.startsWith('lint'))) {
        task.dependsOn linkGameTemplate
    }
    if (task.name.startsWith('mergeOffline') && task.name.endsWith('Assets')) {
        task.dependsOn verifyOfflineRootfs
    }
}

tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    dependsOn linkGameTemplate
    systemProperty 'love2droid.gameTemplateApk', gameTemplateAsset.get().asFile.absolutePath
    systemProperty 'love2droid.testApkOutput', layout.buildDirectory.file('intermediates/game-template/test-game.apk').get().asFile.absolutePath
}

tasks.register('smokeOfflineRootfs', JavaExec) {
    dependsOn 'compileNormalNoRecordDebugUnitTestKotlin', verifyOfflineRootfs
    def unitTests = tasks.named('testNormalNoRecordDebugUnitTest', org.gradle.api.tasks.testing.Test)
    classpath = files(unitTests.map { it.classpath })
    mainClass = 'top.wsdx233.love2droid.OfflineRootfsSmoke'
    maxHeapSize = '512m'
    args new File(offlineAssetsDir.get(), 'proot/offline/manifest.json').absolutePath,
            new File(offlineAssetsDir.get(), 'proot/offline/rootfs-arm64.tar.xz').absolutePath,
            new File(offlineAssetsDir.get().parentFile, 'restored/ubuntu').absolutePath
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.activity:activity-ktx:1.12.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.oboe:oboe:1.9.3'
    implementation 'io.github.rosemoe:editor:0.24.6'
    implementation 'io.github.rosemoe:language-textmate:0.24.6'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    implementation 'io.github.rosemoe:editor-lsp:0.24.6'
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:1.0.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
    implementation 'org.yaml:snakeyaml:2.4'
    implementation 'com.android.tools.build:apksig:9.3.1'
    implementation project(':terminal-view')
}

configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
